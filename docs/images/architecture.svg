<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470"
     viewBox="0 0 1000 470" role="img" aria-label="ExcelFinder 工作原理">
  <title>ExcelFinder 工作原理</title>
  <defs>
    <linearGradient id="ghero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6f3c"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
    <linearGradient id="gbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a7fd4"/>
      <stop offset="100%" stop-color="#1f6f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2933" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="470" rx="0" fill="#f7f9fc"/>
  <rect x="24" y="26" width="268" height="190" rx="12" fill="#ffffff" stroke="#1f6f3c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="24" y="26" width="268" height="34" rx="12" fill="#1f6f3c"/>
  <rect x="24" y="48" width="268" height="12" rx="0" fill="#1f6f3c"/>
  <text x="158.0" y="49" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">① 建立索引（一次性）</text>
  <text x="40" y="84" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">多线程扫描目录</text>
  <text x="40" y="101" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">2–4 线程最优，元数据密集</text>
  <text x="40" y="124" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">筛选表格文件</text>
  <text x="40" y="141" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">xlsx/xlsm/xls/xlsb/csv…</text>
  <text x="40" y="164" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">缓存 (路径,大小,时间)</text>
  <text x="40" y="181" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">未改动文件直接复用</text>
  <circle cx="270" cy="43" r="11" fill="#e8f3ec"/>
  <rect x="366" y="26" width="268" height="190" rx="12" fill="#ffffff" stroke="#2a7fd4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="366" y="26" width="268" height="34" rx="12" fill="#2a7fd4"/>
  <rect x="366" y="48" width="268" height="12" rx="0" fill="#2a7fd4"/>
  <text x="500.0" y="49" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">② 解析内容（可选）</text>
  <text x="382" y="84" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">直接解 OOXML 内部 XML</text>
  <text x="382" y="101" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">不依赖 Office / pandas</text>
  <text x="382" y="124" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">按列去重 + 截断</text>
  <text x="382" y="141" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">重复字符串只记一次</text>
  <text x="382" y="164" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">约 270 文件/秒</text>
  <text x="382" y="181" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">首次约 12 秒 / 3400 文件</text>
  <circle cx="612" cy="43" r="11" fill="#eaf3fd"/>
  <rect x="708" y="26" width="268" height="190" rx="12" fill="#ffffff" stroke="#e08a1a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="708" y="26" width="268" height="34" rx="12" fill="#e08a1a"/>
  <rect x="708" y="48" width="268" height="12" rx="0" fill="#e08a1a"/>
  <text x="842.0" y="49" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">③ 检索（毫秒级）</text>
  <text x="724" y="84" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">纯内存运算</text>
  <text x="724" y="101" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">不碰磁盘</text>
  <text x="724" y="124" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">空格 = AND</text>
  <text x="724" y="141" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">2023 销售部</text>
  <text x="724" y="164" font-size="14" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">通配符 / 正则 / 前缀</text>
  <text x="724" y="181" font-size="12" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">字符前传等场景</text>
  <circle cx="954" cy="43" r="11" fill="#fdf3e3"/>
  <path d="M292 121 L354 121" stroke="#8899a6" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M352 114 L364 121 L352 128 Z" fill="#8899a6"/>
  <path d="M634 121 L696 121" stroke="#8899a6" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M694 114 L706 121 L694 128 Z" fill="#8899a6"/>
  <rect x="708" y="246" width="268" height="96" rx="12" fill="#e8f3ec" stroke="#1f6f3c" stroke-width="2"/>
  <text x="724" y="274" font-size="15" fill="#1f6f3c" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">④ 定位到单元格</text>
  <text x="724" y="298" font-size="12.5" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">对命中的文件做第二遍扫描，</text>
  <text x="724" y="317" font-size="12.5" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">得到「工作表!单元格」+ 整行内容</text>
  <path d="M842 216 L842 246" stroke="#1f6f3c" stroke-width="2.5"/>
  <path d="M835 240 L842 252 L849 240 Z" fill="#1f6f3c"/>
  <rect x="24" y="246" width="610" height="96" rx="12" fill="#ffffff" stroke="#d5dde5" stroke-width="1.5"/>
  <text x="44" y="274" font-size="14.5" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">磁盘缓存 data\index_v1.json</text>
  <text x="44" y="298" font-size="12.5" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">仅文件名约 176 字节/文件 · 含内容约 4.5 KB/文件</text>
  <text x="44" y="318" font-size="12.5" fill="#e08a1a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">超过 256 MB 不落盘，只在内存中保留</text>
  <text x="24" y="384" font-size="13.5" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">关键取舍：索引阶段只回答「哪个文件命中」，坐标按需二次解析 ——</text>
  <text x="24" y="408" font-size="13" fill="#5c6b7a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">若在索引里预存全部单元格坐标，内存要翻好几倍；实测第二遍扫描仅 3.3 ms/文件。</text>
  <text x="24" y="442" font-size="13" fill="#1f6f3c" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif">全程只依赖 Python 标准库：单文件 exe 12.6 MB，目标机器无需任何运行库。</text>
</svg>
